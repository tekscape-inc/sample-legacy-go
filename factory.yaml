version: 1
repo: {github: tekscape-inc/sample-legacy-go, base_branch: main, business: tekscape, customer: null}
stack: {languages: [go], toolchain: {go: "1.22"}}
commands:
  setup: null                       # no module dependencies
  build: {run: "make build"}
  lint: null                        # gate-zero card may add go vet / staticcheck
  test: null                        # NOT "go test ./..." — exits 0 with "[no test files]"
  boot: null                        # gate-zero card adds a --selftest entry point
paths: {src: ["**/*.go"], tests: ["**/*_test.go", "testdata/**"], protected: ["go.sum"]}
risk_class: high
owner_approval: {approvers: [jclendennen], required_for: [risk_high, new_dependency, ci_change]}
lanes: {qwen: false}
